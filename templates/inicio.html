<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Links to the static CSS file generated below -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <title>{{ _('Home') }}</title>
    
</head>
<body>
  
   
    <div class="container">
        <!-- Language selector -->
        <div class="language-selector">
            <a href="{{ url_for('set_language', lang='en') }}"
               class="{{ 'active' if current_language == 'en' else '' }}">
               🇺🇸 EN
            </a>
            <span>|</span>
            <a href="{{ url_for('set_language', lang='es') }}"
               class="{{ 'active' if current_language == 'es' else '' }}">
               🇪🇸 ES
            </a>
           
        </div>

        <div class="section">
            <div class="btn-text">
                <div class="text-content">
                    <h1>{{ _('Create order') }}</h1>
                    <p>{{ _('Assign order to JPAC2') }}</p>
                    <button onclick="window.location.href='{{ url_for('paso1_nombre') }}'">
                        {{ _('Start') }} →
                    </button>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="soy-container">
                <p class="text-soy">{{ _('I am JPAC2') }}</p>
            </div>
            <!-- Fallback image if static file doesn't exist -->
            <img class="robot"
                 src="{{ url_for('static', filename='imagenes/robot.png') }}"
                 onerror="this.src='https://placehold.co/200x300?text=Robot'"
                 alt="{{ _('Robot') }}">
        </div>
    </div>
     
    <script>
        window.onload = () => {
            document.body.classList.add("loaded");
        };
    </script>
</body>
</html>
